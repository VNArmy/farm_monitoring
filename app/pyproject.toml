[project]
name = "greenhouse"
version = "0.2.0"
description = "Giám sát nhà kính trên Raspberry Pi: collector Modbus, web app và màn hình HMI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Dự án cho phép đổi API ở bản tăng số giữa, nên ghim 3.15.*
    "pymodbus==3.15.*",
    "pyserial>=3.5",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
greenhouse = "greenhouse.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# E501: độ dài dòng do ruff format lo; câu SQL dài không tách tự động được.
ignore = ["B008", "SIM105", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["greenhouse"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
